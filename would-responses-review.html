<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Would — Best Responses</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💬</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--primary:#0d9488;--primary-light:#ccfbf1;--bg:#f0fdfa;--card:#ffffff;--text:#134e4a;--muted:#5f7f7c;--border:#d5ece8;--ok:#16a34a;--ok-bg:#dcfce7;--bad:#dc2626;--bad-bg:#fee2e2}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--primary:#2dd4bf;--primary-light:#134e4a;--bg:#0b1715;--card:#13221f;--text:#e6fffa;--muted:#94b8b3;--border:#24403b;--ok:#4ade80;--ok-bg:#14532d;--bad:#f87171;--bad-bg:#7f1d1d}}
:root[data-theme="dark"]{--primary:#2dd4bf;--primary-light:#134e4a;--bg:#0b1715;--card:#13221f;--text:#e6fffa;--muted:#94b8b3;--border:#24403b;--ok:#4ade80;--ok-bg:#14532d;--bad:#f87171;--bad-bg:#7f1d1d}
*{box-sizing:border-box}
body{margin:0;font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:24px 16px}
.card{width:100%;max-width:520px;background:var(--card);border-radius:22px;padding:26px 22px;box-shadow:0 10px 30px rgba(13,148,136,.12);border:1px solid var(--border);animation:pop .35s ease}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
h1{margin:0 0 6px;font-weight:900;font-size:1.6rem;text-align:center}
.sub{text-align:center;color:var(--muted);margin:0 0 20px}
.big{font-size:3.2rem;text-align:center;margin-bottom:8px}
input[type=text]{width:100%;padding:14px 16px;border-radius:14px;border:2px solid var(--border);font:inherit;font-size:1.05rem;background:var(--bg);color:var(--text);outline:none}
input[type=text]:focus{border-color:var(--primary)}
.btn{display:block;width:100%;padding:14px;margin-top:14px;border:none;border-radius:14px;background:var(--primary);color:#fff;font:inherit;font-weight:900;font-size:1.05rem;cursor:pointer;transition:transform .1s,opacity .2s}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--primary);border:2px solid var(--primary)}
.top{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:.95rem;margin-bottom:8px}
.score span{margin-left:10px}
.ok{color:var(--ok)}.bad{color:var(--bad)}
.bar{height:10px;background:var(--border);border-radius:99px;overflow:hidden;margin-bottom:18px}
.bar div{height:100%;background:var(--primary);width:0;transition:width .4s}
.label{display:inline-block;background:var(--primary-light);color:var(--primary);font-weight:900;font-size:.8rem;padding:5px 12px;border-radius:99px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:12px}
.scene{font-size:2.4rem;text-align:center;margin:4px 0 10px;letter-spacing:6px}
.speech{background:var(--bg);border:2px solid var(--border);border-radius:16px;padding:14px 16px;font-size:1.08rem;font-weight:700;margin-bottom:14px;position:relative}
.speech small{display:block;font-weight:700;color:var(--muted);font-size:.78rem;text-transform:uppercase;margin-bottom:4px}
.opts{display:grid;gap:10px}
.opt{text-align:left;padding:13px 14px;border-radius:14px;border:2px solid var(--border);background:var(--card);color:var(--text);font:inherit;font-size:1rem;cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--primary)}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.gap{font-size:1.08rem;line-height:1.6;margin-bottom:6px}
.gap b{color:var(--primary)}
.hint{color:var(--muted);font-size:.9rem;margin:6px 0 10px}
.fb{min-height:26px;text-align:center;font-weight:900;margin-top:12px}
.res{border:3px solid var(--primary);border-radius:18px;padding:18px}
.res h2{margin:0;text-align:center;font-weight:900}
.res .name{text-align:center;color:var(--muted);margin:4px 0 12px;font-weight:700}
.res .num{text-align:center;font-size:2.4rem;font-weight:900}
.res .pct{text-align:center;color:var(--muted);font-weight:700;margin-bottom:10px}
.pass{height:12px;border-radius:99px;background:var(--border);overflow:hidden;margin-bottom:14px}
.pass div{height:100%}
.log{list-style:none;padding:0;margin:0;font-size:.92rem}
.log li{padding:7px 0;border-bottom:1px dashed var(--border)}
.stamp{text-align:center;color:var(--muted);font-size:.85rem;margin-top:12px}
.hidden{display:none}
</style>
</head>
<body>
<div class="card" id="app">

  <!-- Welcome -->
  <section id="welcome">
    <div class="big">💬</div>
    <h1>Would — Best Responses</h1>
    <p class="sub">Match each comment with the best reply.<br>10 questions · 3 question types</p>
    <input type="text" id="nameInput" placeholder="Type your name…" autocomplete="off">
    <button class="btn" id="startBtn" disabled>Start ▶</button>
  </section>

  <!-- Game -->
  <section id="game" class="hidden">
    <div class="top">
      <span id="counter">1 / 10</span>
      <span class="score"><span class="ok">✓ <b id="okN">0</b></span><span class="bad">✗ <b id="badN">0</b></span></span>
    </div>
    <div class="bar"><div id="prog"></div></div>
    <div id="q"></div>
    <div class="fb" id="fb"></div>
  </section>

  <!-- Results -->
  <section id="results" class="hidden">
    <div class="res" id="resCard"></div>
    <button class="btn" id="copyBtn">📋 Copy result</button>
    <button class="btn ghost" id="againBtn">🔄 Play again</button>
  </section>

</div>

<script>
const TOPIC = "Would — Best Responses";
const WORDS = [
  {key:"a", emoji:"💰", scene:"💼💰😤", comment:"Personally, I think I should be paid more, because I'm better at the job.",
   response:"Well, you would say that, wouldn't you!", gap:["Well, you "," say that, wouldn't you!"], answer:"would"},
  {key:"b", emoji:"🎨", scene:"🏠🖌️🖤", comment:"Kate is going to spend her holiday painting all the inside of her house in black and gold.",
   response:"Why would anyone want to do that?", gap:["Why "," anyone want to do that?"], answer:"would"},
  {key:"c", emoji:"🏋️", scene:"🏋️⏰💪", comment:"We're all going to go down to the gym to do some extra training for an hour.",
   response:"Would it be all right if I stayed here and finished this work I'm doing?", gap:[""," it be all right if I stayed here and finished this work I'm doing?"], answer:"would"},
  {key:"d", emoji:"🍵", scene:"🍵🌿😊", comment:"Do you fancy a nice cup of herb tea?",
   response:"I think I'd prefer a cup of coffee, if you don't mind.", gap:["I think I'd "," a cup of coffee, if you don't mind."], answer:"prefer"},
  {key:"e", emoji:"🏖️", scene:"☀️🏞️✈️", comment:"I was thinking of spending my summer holiday in Slovenia.",
   response:"You'd have a great time there, it's a really fantastic place.", gap:["You'd have a great "," there, it's a really fantastic place."], answer:"time"},
  {key:"f", emoji:"🗺️", scene:"🗺️🚶‍♀️❓", comment:"I think I might have given Alice the wrong directions.",
   response:"I wouldn't worry about it. It's very easy to find.", gap:["I "," worry about it. It's very easy to find."], answer:"wouldn't"},
  {key:"g", emoji:"🌙", scene:"🌙🕛🏠", comment:"I don't know how I'm going to get home at this time of night.",
   response:"I'm sure Mark would give you a lift.", gap:["I'm sure Mark would give you a ","."], answer:"lift"},
  {key:"h", emoji:"🦵", scene:"🦵🤕🩺", comment:"I'm still getting that pain in the leg I told you about.",
   response:"It wouldn't be a bad idea to ask the doctor about it.", gap:["It "," be a bad idea to ask the doctor about it."], answer:"wouldn't"},
  {key:"i", emoji:"😠", scene:"👩😠🛍️", comment:"What's the matter with Sue?",
   response:"I think she's annoyed because I wouldn't go to the shops with her.", gap:["I think she's annoyed because I "," go to the shops with her."], answer:"wouldn't"},
  {key:"j", emoji:"📅", scene:"🏢📅🕥", comment:"I have an appointment with Helen Adams for 10.30.",
   response:"If you'd just wait here, I'll see if she's free.", gap:["If you'd just "," here, I'll see if she's free."], answer:"wait"}
];
const TYPES = ["pick4","type","match"];
const LABELS = {pick4:"Choose the best response", type:"Complete the response", match:"Which comment fits this reply?"};

let name="", qs=[], i=0, ok=0, bad=0, log=[];
const $ = id => document.getElementById(id);
const shuffle = a => { a=[...a]; for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]];} return a; };
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;");

$("nameInput").addEventListener("input", e => $("startBtn").disabled = !e.target.value.trim());
$("nameInput").addEventListener("keydown", e => { if(e.key==="Enter" && e.target.value.trim()) start(); });
$("startBtn").onclick = start;
$("againBtn").onclick = start;
$("copyBtn").onclick = copyResult;

function start(){
  name = $("nameInput").value.trim();
  const order = shuffle(WORDS);
  const types = shuffle(order.map((_,k)=>TYPES[k%3]));
  qs = order.map((w,k)=>({w, type:types[k]}));
  i=0; ok=0; bad=0; log=[];
  $("okN").textContent=0; $("badN").textContent=0;
  $("welcome").classList.add("hidden"); $("results").classList.add("hidden"); $("game").classList.remove("hidden");
  show();
}

function distractors(w, field){
  return shuffle(WORDS.filter(x=>x!==w)).slice(0,3).map(x=>x[field]);
}

function show(){
  const {w,type} = qs[i];
  $("counter").textContent = `${i+1} / ${qs.length}`;
  $("prog").style.width = (i/qs.length*100)+"%";
  $("fb").textContent = "";
  let h = `<div class="label">${LABELS[type]}</div><div class="scene">${w.scene}</div>`;
  if(type==="pick4"){
    h += `<div class="speech"><small>Comment</small>${esc(w.comment)}</div><div class="opts">`;
    shuffle([w.response, ...distractors(w,"response")]).forEach(o=>{
      h += `<button class="opt" data-v="${esc(o)}">${esc(o)}</button>`;
    });
    h += `</div>`;
  } else if(type==="match"){
    h += `<div class="speech"><small>Reply</small>${esc(w.response)}</div><div class="opts">`;
    shuffle([w.comment, ...distractors(w,"comment")]).forEach(o=>{
      h += `<button class="opt" data-v="${esc(o)}">${esc(o)}</button>`;
    });
    h += `</div>`;
  } else {
    h += `<div class="speech"><small>Comment</small>${esc(w.comment)}</div>
      <div class="gap">${esc(w.gap[0])}<b>______</b>${esc(w.gap[1])}</div>
      <div class="hint">💡 Starts with <b>${w.answer[0].toUpperCase()}</b> · ${w.answer.length} letters${w.answer.includes("'")?" (with an apostrophe)":""}</div>
      <input type="text" id="typeIn" placeholder="Type the missing word…" autocomplete="off" autocapitalize="off">
      <button class="btn" id="checkBtn">Check ✔</button>`;
  }
  $("q").innerHTML = h;
  if(type==="type"){
    const inp=$("typeIn"); inp.focus();
    const go=()=>{ if(!inp.value.trim()) return; inp.disabled=true; $("checkBtn").disabled=true;
      const norm=s=>s.trim().toLowerCase().replace(/[’`]/g,"'");
      answer(norm(inp.value)===norm(w.answer), w.answer); };
    $("checkBtn").onclick=go;
    inp.addEventListener("keydown",e=>{if(e.key==="Enter")go();});
  } else {
    const correct = type==="pick4" ? w.response : w.comment;
    document.querySelectorAll(".opt").forEach(b=>{
      b.onclick=()=>{
        document.querySelectorAll(".opt").forEach(x=>{ x.disabled=true; if(x.dataset.v===esc(correct)||x.textContent===correct) x.classList.add("right"); });
        const isRight = b.textContent===correct;
        if(!isRight) b.classList.add("wrong");
        answer(isRight, null);
      };
    });
  }
}

function answer(right, shown){
  const {w} = qs[i];
  if(right){ ok++; $("okN").textContent=ok; $("fb").innerHTML=`<span class="ok">✓ Great!</span>`; }
  else { bad++; $("badN").textContent=bad; $("fb").innerHTML=`<span class="bad">✗ ${shown?`Answer: <b>${esc(shown)}</b>`:"Not quite"}</span>`; }
  log.push({w, right});
  setTimeout(()=>{ i++; i<qs.length ? show() : finish(); }, shown && !right ? 1800 : 1300);
}

function stamp(){
  const d=new Date(), m=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return `${String(d.getDate()).padStart(2,"0")} ${m[d.getMonth()]} ${d.getFullYear()} · ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
}

let lastStamp="";
function finish(){
  $("prog").style.width="100%";
  $("game").classList.add("hidden"); $("results").classList.remove("hidden");
  const pct=Math.round(ok/qs.length*100), pass=pct>=60;
  lastStamp=stamp();
  const sorted=[...log].sort((x,y)=>x.w.key.localeCompare(y.w.key));
  $("resCard").innerHTML = `
    <h2>💬 ${TOPIC}</h2>
    <div class="name">👤 ${esc(name)}</div>
    <div class="num">${ok}/${qs.length}</div>
    <div class="pct">${pct}% · ${pass?"Passed 🎉":"Keep practising 💪"}</div>
    <div class="pass"><div style="width:${pct}%;background:${pass?"var(--ok)":"var(--bad)"}"></div></div>
    <ul class="log">${sorted.map(l=>`<li>${l.right?'<span class="ok">✓</span>':'<span class="bad">✗</span>'} <b>${l.w.key}</b> → ${esc(l.w.response)}</li>`).join("")}</ul>
    <div class="stamp">📅 ${lastStamp}</div>`;
  $("copyBtn").textContent="📋 Copy result";
}

function copyResult(){
  const sorted=[...log].sort((x,y)=>x.w.key.localeCompare(y.w.key));
  const pct=Math.round(ok/qs.length*100);
  const txt=`📋 Vocabulary Exercise — ${TOPIC}\n👤 ${name}\n📊 Score: ${ok}/${qs.length} (${pct}%)\n`+
    sorted.map(l=>`${l.right?"✓":"✗"} ${l.w.key} — ${l.w.response}`).join("\n")+`\n📅 ${lastStamp}`;
  const done=()=>{$("copyBtn").textContent="✅ Copied!";};
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(txt).then(done).catch(fallback);} else fallback();
  function fallback(){const t=document.createElement("textarea");t.value=txt;document.body.appendChild(t);t.select();try{document.execCommand("copy");done();}catch(e){}t.remove();}
}
</script>
</body>
</html>
