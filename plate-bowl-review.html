<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>body{margin:0}[hidden]{display:none!important}</style></head><body>
<title>Plate &amp; bowl Collocations Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap">
<style>
/* Layout: one centred 520px game card, three screens swapped in place */
:root{
  --primary:#e11d48; --primary-light:color-mix(in srgb, #e11d48 14%, #ffffff);
  --bg:color-mix(in srgb, #e11d48 6%, #f8fafc); --card:#ffffff; --fg:#1e293b; --muted:#64748b;
  --line:color-mix(in srgb, #e11d48 18%, #e2e8f0);
  --good:#16a34a; --good-bg:#dcfce7; --bad:#dc2626; --bad-bg:#fee2e2;
  --font:"Nunito", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --primary:#fb7185; --primary-light:color-mix(in srgb, #fb7185 18%, #0f172a);
  --bg:#0b1220; --card:#131c2e; --fg:#e2e8f0; --muted:#94a3b8; --line:#26334d;
  --good:#4ade80; --good-bg:#14321f; --bad:#f87171; --bad-bg:#3a1717; color-scheme:dark}}
:root[data-theme="dark"]{
  --primary:#fb7185; --primary-light:color-mix(in srgb, #fb7185 18%, #0f172a);
  --bg:#0b1220; --card:#131c2e; --fg:#e2e8f0; --muted:#94a3b8; --line:#26334d;
  --good:#4ade80; --good-bg:#14321f; --bad:#f87171; --bad-bg:#3a1717; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;padding:24px 16px;min-height:100%}
.wrap{max-width:520px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:0 10px 30px -18px color-mix(in srgb,var(--primary) 60%,transparent)}
h1{font-weight:900;font-size:1.7rem;margin:0;text-wrap:balance;line-height:1.15}
.sub{color:var(--muted);margin:6px 0 0}
.big{font-size:3.2rem;line-height:1}
label{display:block;font-weight:700;margin:16px 0 6px;font-size:.95rem}
input[type=text],select{width:100%;font:inherit;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--fg)}
input[type=text]:focus,select:focus{outline:none;border-color:var(--primary)}
.btn{font:inherit;font-weight:900;border:0;border-radius:14px;padding:13px 18px;background:var(--primary);color:#fff;cursor:pointer;width:100%;margin-top:18px;transition:transform .12s, opacity .2s}
.btn:hover:not(:disabled){transform:translateY(-1px)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:var(--primary-light);color:var(--primary)}
.btn:focus-visible,.opt:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;font-weight:700;font-size:.9rem;color:var(--muted)}
.counts{display:flex;gap:10px}.counts b{font-variant-numeric:tabular-nums}
.ok{color:var(--good)}.no{color:var(--bad)}
.bar{height:8px;background:var(--primary-light);border-radius:99px;overflow:hidden;margin:10px 0 18px}
.bar i{display:block;height:100%;background:var(--primary);width:0;transition:width .4s}
.label{display:inline-block;background:var(--primary-light);color:var(--primary);font-weight:900;font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;padding:5px 10px;border-radius:99px}
.scene{font-size:2.6rem;text-align:center;margin:16px 0 6px;letter-spacing:6px}
.clue{text-align:center;font-size:1.08rem;margin:0 0 16px}
.frame{text-align:center;font-weight:900;font-size:1.3rem;margin:4px 0 4px}
.frame span{color:var(--primary)}
.hint{text-align:center;color:var(--muted);font-size:.9rem;margin:0 0 6px}
.phrase{text-align:center;font-weight:900;font-size:1.6rem;margin:22px 0;color:var(--primary);text-wrap:balance}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{font:inherit;font-weight:700;padding:14px 10px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer;min-width:0;transition:border-color .15s, background .15s}
.opt:hover:not(:disabled){border-color:var(--primary)}
.opt.emo{font-size:2.3rem;padding:12px}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.fb{min-height:28px;text-align:center;font-weight:900;margin-top:14px}
@keyframes pop{0%{transform:scale(.96);opacity:.4}100%{transform:scale(1);opacity:1}}
.q{animation:pop .25s ease-out}
.result{border:3px solid var(--primary);border-radius:20px;padding:20px;background:var(--card)}
.rhead{display:flex;gap:12px;align-items:center}
.score{font-size:2.6rem;font-weight:900;font-variant-numeric:tabular-nums;margin:12px 0 0}
.pass{height:12px;border-radius:99px;background:var(--line);overflow:hidden;margin:8px 0 4px}
.pass i{display:block;height:100%}
.meta{color:var(--muted);font-size:.9rem;font-variant-numeric:tabular-nums}
ul.log{list-style:none;padding:0;margin:14px 0 0;display:grid;gap:4px}
ul.log li{display:flex;gap:8px;font-size:.95rem}
.status{margin-top:14px;padding:12px;border-radius:12px;font-weight:700;font-size:.93rem;background:var(--primary-light)}
.status a.btn{display:block;text-align:center;text-decoration:none;margin-top:10px}
@media (max-width:420px){.card{padding:18px}.scene{font-size:2.2rem}.opts{grid-template-columns:1fr}.opts.emoji{grid-template-columns:1fr 1fr}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap">
  <!-- Welcome -->
  <section class="card" id="welcome">
    <div class="big">🥣</div>
    <h1 style="margin-top:10px">Plate &amp; bowl collocations</h1>
    <p class="sub">12 expressions · Pick 4, type the missing word, match the picture.</p>
    <form id="startForm">
      <label for="name">Your name / Họ và tên</label>
      <input type="text" id="name" autocomplete="name" placeholder="e.g. Nguyễn Minh Anh">
      <label for="cls">Class / Lớp</label>
      <select id="cls">
        <option value="" selected disabled>— Chọn lớp —</option>
        <option>A2</option><option>B1</option><option>B2</option><option>IELTS</option>
        <option>Khác</option>
      </select>
      <button class="btn" id="startBtn" type="submit" disabled>Start ▶</button>
    </form>
  </section>

  <!-- Game -->
  <section class="card" id="game" hidden>
    <div class="top"><span id="qnum"></span><span class="counts"><b class="ok">✓ <span id="cOk">0</span></b><b class="no">✗ <span id="cNo">0</span></b></span></div>
    <div class="bar"><i id="prog"></i></div>
    <div id="qbox"></div>
    <div class="fb" id="fb" aria-live="polite"></div>
  </section>

  <!-- Results -->
  <section id="results" hidden>
    <div class="result" id="rcard"></div>
    <div id="status"></div>
    <button class="btn ghost" id="copyBtn" type="button">📋 Copy result</button>
    <button class="btn" id="againBtn" type="button">🔁 Play again</button>
  </section>
</div>

<script>
/* ===== Teacher settings: Google Form that collects results =====
   formUrl: the form link up to and including the id, ending with "/"
   e.g. "https://docs.google.com/forms/d/e/1FAIpQL.../"
   fields: the entry numbers from the form's pre-filled link        */
const RESULTS = {
  "formUrl": "https://docs.google.com/forms/d/e/1FAIpQLSeOg0kZytzgKzyBIxFD-THAoS44sTOEvDr4VqO1LnX-6kmfYQ/",
  "fields": {
    "name": "entry.1398331139",
    "cls": "entry.770361974",
    "lesson": "entry.449687323",
    "score": "entry.426447052",
    "details": "entry.1388890653"
  }
};

const TOPIC = "Plate & bowl", TOPIC_EMOJI = "🥣";
const LABELS = {"pick4": "Choose the correct expression", "type": "Type the missing word", "match": "Pick the picture for this expression"};
const WORDS = [
 {
  "word": "clear the plates away",
  "key": "clear",
  "frame": "___ the plates away",
  "emoji": "🤵",
  "scene": "🤵🍽️➡️",
  "clue": "The waiter takes them when you've finished."
 },
 {
  "word": "drop a plate",
  "key": "drop",
  "frame": "___ a plate",
  "emoji": "😬",
  "scene": "🍽️⬇️😬",
  "clue": "It slips out of your hand."
 },
 {
  "word": "smash a plate",
  "key": "smash",
  "frame": "___ a plate",
  "emoji": "💥",
  "scene": "🍽️💥🧩",
  "clue": "It breaks into many pieces."
 },
 {
  "word": "pile plates in the sink",
  "key": "pile",
  "frame": "___ plates in the sink",
  "emoji": "🗼",
  "scene": "🍽️🍽️🍽️",
  "clue": "Put dirty ones on top of each other and leave them."
 },
 {
  "word": "heap food on your plate",
  "key": "heap",
  "frame": "___ food on your plate",
  "emoji": "🤤",
  "scene": "🍗🍝🤤",
  "clue": "Take a huge amount at the buffet."
 },
 {
  "word": "a dinner plate",
  "key": "dinner",
  "frame": "a ___ plate",
  "emoji": "🍽️",
  "scene": "🍽️🍴🌙",
  "clue": "The large flat plate for the main meal."
 },
 {
  "word": "a dirty plate",
  "key": "dirty",
  "frame": "a ___ plate",
  "emoji": "🤢",
  "scene": "🍽️🤢🙋",
  "clue": "Waiter! Can I have a clean one, please?"
 },
 {
  "word": "an empty plate",
  "key": "empty",
  "frame": "an ___ plate",
  "emoji": "⭕",
  "scene": "⭕😋👍",
  "clue": "He ate everything — nothing left!"
 },
 {
  "word": "have a bowl of rice",
  "key": "have",
  "frame": "___ a bowl of rice",
  "emoji": "🍚",
  "scene": "🍚🥢😋",
  "clue": "Eat this for lunch."
 },
 {
  "word": "empty a packet into a bowl",
  "key": "empty",
  "frame": "___ a packet into a bowl",
  "emoji": "📦",
  "scene": "📦➡️🥣",
  "clue": "Pour all the soup powder out."
 },
 {
  "word": "lick your bowl clean",
  "key": "lick",
  "frame": "___ your bowl clean",
  "emoji": "👅",
  "scene": "🥣👅✨",
  "clue": "Kids love doing it — but not with guests!"
 },
 {
  "word": "a sugar bowl",
  "key": "sugar",
  "frame": "a ___ bowl",
  "emoji": "🍬",
  "scene": "🍬🥄☕",
  "clue": "A small bowl on the table for sweetening tea."
 }
];

const $ = id => document.getElementById(id);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const norm = s => s.toLowerCase().replace(/[’']/g, "'").replace(/\s*-\s*/g, "-").replace(/\s+/g, " ").trim();
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

let student = "", klass = "", queue = [], idx = 0, ok = 0, no = 0, log = [], locked = false, finishedAt = null;

const classValue = () => $("cls").value || "";
const checkReady = () => { $("startBtn").disabled = !($("name").value.trim() && classValue()); };
$("name").addEventListener("input", checkReady);
$("cls").addEventListener("change", checkReady);
$("startForm").addEventListener("submit", e => { e.preventDefault(); if ($("startBtn").disabled) return; student = $("name").value.trim(); klass = classValue(); start(); });
$("againBtn").addEventListener("click", start);
$("copyBtn").addEventListener("click", copyResult);

function start() {
  const types = ["pick4", "type", "match"];
  queue = shuffle(WORDS).map((w, i) => ({ w, t: types[i % 3] }));
  queue = shuffle(queue);
  idx = 0; ok = 0; no = 0; log = [];
  $("welcome").hidden = true; $("results").hidden = true; $("game").hidden = false;
  render();
}

function render() {
  locked = false;
  const { w, t } = queue[idx];
  $("qnum").textContent = `Question ${idx + 1} / ${queue.length}`;
  $("cOk").textContent = ok; $("cNo").textContent = no;
  $("prog").style.width = (idx / queue.length * 100) + "%";
  $("fb").textContent = "";
  let h = `<div class="q"><span class="label">${esc(LABELS[t])}</span>`;
  if (t === "pick4") {
    const opts = shuffle([w, ...shuffle(WORDS.filter(x => x !== w)).slice(0, 3)]);
    h += `<div class="scene">${w.scene}</div><p class="clue">${esc(w.clue)}</p><div class="opts">` +
      opts.map(o => `<button class="opt" type="button" data-v="${esc(o.word)}">${esc(o.word)}</button>`).join("") + `</div>`;
  } else if (t === "match") {
    const opts = shuffle([w, ...shuffle(WORDS.filter(x => x !== w)).slice(0, 3)]);
    h += `<div class="phrase">${esc(w.word)}</div><div class="opts emoji">` +
      opts.map(o => `<button class="opt emo" type="button" data-v="${esc(o.word)}" aria-label="${esc(o.word)}">${o.emoji}</button>`).join("") + `</div>`;
  } else {
    const fr = esc(w.frame).replace("___", "<span>______</span>");
    h += `<div class="scene">${w.scene}</div><p class="clue">${esc(w.clue)}</p><p class="frame">${fr}</p>
      <p class="hint">Starts with “${esc(w.key[0])}” · ${w.key.length} letters</p>
      <form id="typeForm"><input type="text" id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Your answer">
      <button class="btn" type="submit">Check ✔</button></form>`;
  }
  $("qbox").innerHTML = h + `</div>`;
  if (t === "type") {
    $("ans").focus();
    $("typeForm").addEventListener("submit", e => {
      e.preventDefault(); if (locked) return;
      const v = norm($("ans").value); if (!v) return;
      const good = v === norm(w.key) || v === norm(w.word);
      $("ans").disabled = true;
      answer(good, w);
    });
  } else {
    document.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => {
      if (locked) return;
      const good = b.dataset.v === w.word;
      document.querySelectorAll(".opt").forEach(x => { x.disabled = true; if (x.dataset.v === w.word) x.classList.add("right"); });
      if (!good) b.classList.add("wrong");
      answer(good, w);
    }));
  }
}

function answer(good, w) {
  locked = true;
  if (good) ok++; else no++;
  log.push({ word: w.word, good });
  $("cOk").textContent = ok; $("cNo").textContent = no;
  $("fb").innerHTML = good ? `<span class="ok">✓ Correct!</span>` : `<span class="no">✗ Answer: ${esc(w.word)}</span>`;
  setTimeout(() => { idx++; idx < queue.length ? render() : finish(); }, good ? 1200 : 1900);
}

const fmtDate = d => d.toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" }) + " · " + d.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });

function finish() {
  finishedAt = new Date();
  const total = queue.length, pct = Math.round(ok / total * 100), pass = pct >= 70;
  $("game").hidden = true; $("results").hidden = false;
  $("rcard").innerHTML = `
    <div class="rhead"><div class="big">${TOPIC_EMOJI}</div><div><span class="label">Vocabulary exercise</span><h1>${esc(TOPIC)} collocations</h1></div></div>
    <p style="margin:14px 0 0;font-weight:700">👤 ${esc(student)}${klass ? " · " + esc(klass) : ""}</p>
    <p class="score">${ok}/${total} <span style="font-size:1.2rem;color:var(--muted)">(${pct}%)</span></p>
    <div class="pass"><i style="width:${pct}%;background:${pass ? "var(--good)" : "var(--bad)"}"></i></div>
    <p class="meta" style="margin:0">${pass ? "✅ Passed (70% or more)" : "🔁 Try again to reach 70%"}</p>
    <ul class="log">${log.map(l => `<li><b class="${l.good ? "ok" : "no"}">${l.good ? "✓" : "✗"}</b><span>${esc(l.word)}</span></li>`).join("")}</ul>
    <p class="meta" style="margin:14px 0 0">📅 ${fmtDate(finishedAt)}</p>`;
  sendResult(pct);
}

function resultText() {
  const total = queue.length, pct = Math.round(ok / total * 100);
  return `📋 Vocabulary Exercise — ${TOPIC}\n👤 ${student}${klass ? " (" + klass + ")" : ""}\n📊 Score: ${ok}/${total} (${pct}%)\n` +
    log.map(l => (l.good ? "✓ " : "✗ ") + l.word).join("\n") + `\n📅 ${fmtDate(finishedAt)}`;
}

function copyResult() {
  const t = resultText();
  const done = () => { $("copyBtn").textContent = "✅ Copied!"; setTimeout(() => $("copyBtn").textContent = "📋 Copy result", 1800); };
  try {
    navigator.clipboard.writeText(t).then(done, () => fallbackCopy(t, done));
  } catch (e) { fallbackCopy(t, done); }
}
function fallbackCopy(t, done) {
  const ta = document.createElement("textarea"); ta.value = t; document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); done(); } catch (e) {} ta.remove();
}

/* ===== Send to the teacher's Google Form ===== */
function formParams(pct) {
  const f = RESULTS.fields, p = new URLSearchParams();
  const total = queue.length;
  if (f.name) p.append(f.name, student);
  if (f.cls) p.append(f.cls, klass);
  if (f.lesson) p.append(f.lesson, TOPIC + " collocations");
  if (f.score) p.append(f.score, `${ok}/${total} (${pct}%)`);
  if (f.details) p.append(f.details, log.map(l => (l.good ? "✓ " : "✗ ") + l.word).join("; "));
  return p;
}
function sendResult(pct) {
  const st = $("status");
  if (!RESULTS.formUrl) {
    st.innerHTML = `<div class="status">ℹ️ Bấm <b>Copy result</b> rồi dán gửi cô qua Zalo / Teams.</div>`;
    return;
  }
  const params = formParams(pct);
  const manual = `<a class="btn" href="${esc(RESULTS.formUrl + "viewform?usp=pp_url&" + params.toString())}" target="_blank" rel="noopener">📨 Nộp kết quả cho cô</a>`;
  st.innerHTML = `<div class="status">⏳ Đang gửi kết quả cho cô…</div>`;
  fetch(RESULTS.formUrl + "formResponse", { method: "POST", mode: "no-cors", body: params })
    .then(() => { st.innerHTML = `<div class="status">✅ Đã gửi kết quả cho cô. Em không cần làm gì thêm.</div>`; })
    .catch(() => {
      st.innerHTML = `<div class="status">Bấm nút dưới đây, sau đó bấm <b>Gửi / Submit</b> trên Google Form để nộp bài.${manual}</div>`;
    });
}
</script>

</body></html>
